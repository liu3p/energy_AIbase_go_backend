paths:
  /api/v1/log/ems:
    get:
      description: 查询ems设备信息
      operationId: query-ems
      parameters:
      - default: <token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功 {\"topic\":\"ems\",\"content\":{\"ems\":{\"sn\":\"ems\",\"name\":\"ems\",
            \"status\":2}}}
          schema:
            $ref: '#/definitions/handlers.QueryEmsResp'
        "401":
          description: '认证失败 {\"code\": 401, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "403":
          description: '拒绝访问 {\"code\": 403, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "404":
          description: '没有找到ems {\"code\": 404, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "503":
          description: '服务不可访问 {\"code\": 503, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
      summary: 查询ems设备
      tags:
      - ems
  /api/v1/log/ems/prop:
    get:
      description: 查询指定网关下某子设备属性
      operationId: query-ems-prop
      parameters:
      - default: <token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功 {\"topic\":\"property\",\"content\":{\"11223355ems\":[{\"at\":1699263620341,\"k\":\"Runstate\",\"mt\":1699263620341,\"v\":1}]}}
          schema:
            $ref: '#/definitions/models.TeleData'
        "401":
          description: '认证失败 {\"code\": 401, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "403":
          description: '拒绝访问 {\"code\": 403, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "503":
          description: '服务不可访问 {\"code\": 503, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
      summary: 查询子设备属性
      tags:
      - ems
  /api/v1/log/ems/remote/{method}:
    post:
      description: ems遥控或遥调下发
      operationId: query-ems-remote
      parameters:
      - default: <token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 方法名
        example: "1>ems策略下发：PolicyConfig,\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t2>手动/智能策略下发:\tPlanSet,\t3>AGC对象投入/退出:\tAGCExitCtrl,\t4>AGC对象远方/就地:AGCRemoteCtrl,\t5>储能一体机投入/退出:CabExitCtrl,\t6>AGC策略修改:AGCStrategyMod,\t7>并网点增删改:ParallelBranch"
        in: path
        name: method
        required: true
        type: string
      - default: '{"content": "body", "sn": "项目sn号"}'
        description: ems策略下发
        example: '{"content":[{\"type\":1,\"bus\":\"bus1\",\"date\":\"2006-01-02\",\"config_data\":{\"plans\":[{\"p\":100.45,\"bt\":\"00:00\",\"et\":\"01:21\"},{\"p\":0,\"bt\":\"23:21\",\"et\":\"24:00\"},{\"p\":-100.45,\"bt\":\"01:21\",\"et\":\"23:21\"}],\"soc_up\":100,\"soc_dn\":48.5,\"interval\":15}},{\"type\":1,\"bus\":\"bus2\",\"date\":\"2006-01-02\",\"config_data\":{\"plans\":[{\"p\":110.45,\"bt\":\"00:00\",\"et\":\"01:21\"},{\"p\":10,\"bt\":\"23:21\",\"et\":\"24:00\"},{\"p\":-100.45,\"bt\":\"01:21\",\"et\":\"23:21\"}],\"soc_up\":100,\"soc_dn\":28,\"interval\":15}}],
          "sn": "项目sn号"}'
        in: body
        name: RemoteReq-情况1
        required: true
        schema:
          type: string
      - default: '{"content": "", "sn": "项目sn号"}'
        description: 手动/智能策略下发 (mode：类型0-手动策略，2-智能策略)
        example: '{"content"：[{\"mode\":0,\"bus\":\"bus1\",\"date\":\"2006-01-02\",\"p\":100.0，\"max_p\":322.1\"soc_up\":85,\"soc_dn\":15，\"chg_max\":100,\"dchg_max\":200，\"chg_eff\":80,\"dchg_eff\":90}],
          "sn": "项目sn号"}'
        in: body
        name: RemoteReq-情况2
        required: true
        schema:
          type: string
      - default: '{"content": "", "sn": "项目sn号"}'
        description: AGC对象投入/退出  (0-退出；1-投入)
        example: '{"content": {\"state\": 0}, "sn": "项目sn号"}'
        in: body
        name: RemoteReq-情况3
        required: true
        schema:
          type: string
      - default: '{"content": "", "sn": "项目sn号"}'
        description: AGC对象远方/就地  (0-就地；1-远方)
        example: '{"content": {\"state\": 0}, "sn": "项目sn号"}'
        in: body
        name: RemoteReq-情况4
        required: true
        schema:
          type: string
      - default: '{"content": "", "sn": "项目sn号"}'
        description: 储能一体机投入/退出  (0-退出；1-投入)
        example: '{"content": {\"state\": 0}, "sn": "项目sn号"}'
        in: body
        name: RemoteReq-情况5
        required: true
        schema:
          type: string
      - default: '{"content": "", "sn": "项目sn号"}'
        description: AGC策略修改  (0-功率设定；1-计划曲线；2-智能模式)
        example: '{"content": {\"state\": 0}, "sn": "项目sn号"}'
        in: body
        name: RemoteReq-情况6
        required: true
        schema:
          type: string
      - default: '{"content": "", "sn": "项目sn号"}'
        description: 并网点增删改
        example: '{"content"：[{\"bus\":\"bus1\",\"demand\":1000.2,\"trans_cap\":800.3,\"config_data\":[{\"sn\":\"esscab1\"},{\"sn\":\"esscab2\"}]},{\"bus\":\"bus2\",\"demand\":1000.2,\"trans_cap\":800.3,\"config_data\":[{\"sn\":\"esscab3\"},{\"sn\":\"esscab4\"}]}]",
          "sn": "项目sn号"}'
        in: body
        name: RemoteReq-情况7
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "1":
          description: "CODE 200.  ems策略下发 下发成功 {\\\"topic\\\": \\\"LocalPolicyUpAuto\\\",
            \\\"content\\\": [{\\\"type\\\":1,\\\"bus\\\":\\\"bus1\\\",\\\"status\\\":0,\\\"exec_t\\\":\\\"2023-09-15\t\t\t\t\t\t\t\t\t\t14:17:00\\\",\\\"from\\\":2,\\\"plans\\\":[{\\\"p\\\":100.45,\\\"bt\\\":\\\"00:00\\\",\\\"et\\\":\\\"01:21\\\"},{\\\"p\\\":0,\\\"bt\\\":\\\"23:21\\\",\\\"et\\\":\\\"24:00\\\"},{\\\"p\\\":-100.45,\\\"bt\\\":\\\"01:21\\\",\\\"et\\\":\\\"23:21\\\"}]},{\\\"type\\\":1,\\\"bus\\\":\\\"bus2\\\",\\\"status\\\":0,\\\"exec_t\\\":\\\"2023-09-15\t14:17:00\\\",\\\"from\\\":2,\\\"plans\\\":[{\\\"p\\\":100.45,\\\"bt\\\":\\\"00:00\\\",\\\"et\\\":\\\"01:21\\\"},{\\\"p\\\":0,\\\"bt\\\":\\\"23:21\\\",\\\"et\\\":\\\"24:00\\\"},{\\\"p\\\":-100.45,\\\"bt\\\":\\\"01:21\\\",\\\"et\\\":\\\"23:21\\\"}]}]}"
          schema:
            $ref: '#/definitions/models.CommonResp'
        "2":
          description: "CODE 200.  手动/智能策略下发  手动策略 下发成功 {\\\"topic\\\": \\\"LocalPolicyUpHand\\\",
            \\\"content\\\": [{\\\"type\\\":1,\\\"bus\\\":\\\"bus1\\\",\\\"status\\\":0,\\\"exec_t\\\":\\\"2023-09-15\t\t\t\t\t\t\t\t14:17:00\\\",\\\"soc_up\\\":90,\\\"soc_dn\\\":15,\\\"p\\\":100.1,\\\"from\\\":0}]}"
          schema:
            $ref: '#/definitions/models.CommonResp'
        "3":
          description: "CODE 200.  手动/智能策略下发  智能策略 下发成功 {\\\"topic\\\": \\\"LocalPolicyUpSmart\\\",
            \\\"content\\\": [{\\\"max_p\\\":233.2,\\\"bus\\\":\\\"bus1\\\",\\\"type\\\":1,\\\"status\\\":0,\\\"from\\\":2,\\\"exec_t\\\":\\\"2023-09-15\t14:17:00\\\",\\\"chg_max\\\":40.2,\\\"dchg_max\\\":40.2,\\\"chg_eff\\\":89.9,\\\"dchg_eff\\\":89.9,\\\"ele_state\\\":0,\\\"chg_cpt\\\":100,\\\"dchg_cpt\\\":20,\\\"soc\\\":25,\\\"soc_up\\\":85,\\\"soc_dn\\\":15}]"
          schema:
            $ref: '#/definitions/models.CommonResp'
        "4":
          description: 'CODE 200.  AGC对象投入/退出 下发成功 {\"topic\": \"AGCExitCtrlReport\",
            \"content\": {\"ack:\": true}}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "5":
          description: 'CODE 200.  AGC对象远方/就地 下发成功 {\"topic\": \"AGCRemoteCtrlReport\",
            \"content\": {\"ack:\": true}}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "6":
          description: 'CODE 200.  储能一体机投入/退出 下发成功  {\"topic\": \"CabExitCtrlReport\",
            \"content\": {\"ack:\": true}}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "7":
          description: 'CODE 200.  AGC策略修改 下发成功 {\"topic\": \"AGCStrategyModReport\",
            \"content\": {\"ack:\": true}}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "8":
          description: "CODE 200.  并网点增删改 下发成功 {\\\"topic\\\": \\\"ParallelBranchReport\\\",
            \\\"content\\\": [{\\\"k\t\\\":\\\"20231128e\tms\t\\\",\\\"v\\\":[{\\\"from\t\\\":1,\\\"bus\\\":\\\"bus1\\\",\\\"demand\\\":1000.2,\\\"trans_cap\\\":800.3,\\\"config_data\\\":[{\\\"sn\\\":\\\"esscab1\\\"},{\\\"sn\\\":\\\"esscab2\\\"}]},{\\\"from\t\\\":1,\\\"bus\\\":\\\"bus2\\\",\\\"demand\\\":1000.2,\\\"trans_cap\\\":800.3,\\\"config_data\\\":[{\\\"sn\\\":\\\"esscab3\\\"},{\\\"sn\\\":\\\"esscab4\\\"}]}]}]}"
          schema:
            $ref: '#/definitions/models.CommonResp'
        "9":
          description: 'CODE 401.  认证失败 {\"code\": 401, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "10":
          description: 'CODE 403.  拒绝访问 {\"code\": 403, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
        "11":
          description: 'CODE 503.  服务不可访问 {\"code\": 503, \"msg\": \"\"}'
          schema:
            $ref: '#/definitions/models.CommonResp'
      summary: ems遥控/调
      tags:
      - ems
